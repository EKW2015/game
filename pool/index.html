<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#120c08" />
    <title>八球台球</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎱</text></svg>" />
    <link rel="stylesheet" href="css/pool.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <h1>🎱 八球台球</h1>
        <div class="tools">
          <button class="btn" id="btn-sound" type="button">音效：开</button>
          <button class="btn" id="btn-reset" type="button">选模式</button>
        </div>
      </header>

      <div class="stage" id="stage">
        <canvas id="table" width="868" height="468" aria-label="台球桌"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlay-title">八球台球</h2>
          <p id="overlay-msg">没有鼠标也能玩：按 1 对战电脑，2 双人，3 练习。开局后用方向键瞄准、空格击打。手机请点下面的大按钮。</p>
          <div class="modes" id="modes">
            <button class="mode play" type="button" data-mode="vsai">对战电脑</button>
            <button class="mode" type="button" data-mode="hotseat">双人对战</button>
            <button class="mode" type="button" data-mode="practice">练习模式</button>
          </div>
        </div>
      </div>

      <div class="pad" id="pad">
        <button class="pad__btn" type="button" data-hold="left">◀ 左转<br><small>A / ←</small></button>
        <button class="pad__btn" type="button" data-hold="right">右转 ▶<br><small>D / →</small></button>
        <button class="pad__btn" type="button" data-hold="down">力道－<br><small>S / ↓</small></button>
        <button class="pad__btn" type="button" data-hold="up">力道＋<br><small>W / ↑</small></button>
        <button class="pad__shoot" type="button" id="btn-shoot">击打<br><small>空格</small></button>
      </div>

      <div class="hud">
        <div class="card" id="p0">
          <h2 id="p0-name">你</h2>
          <p id="p0-group">尚未分色</p>
          <div class="balls-row" id="p0-balls"></div>
        </div>
        <div class="card turn" id="turn-card">
          <div id="turn"><strong>选择模式开始</strong></div>
        </div>
        <div class="card" id="p1">
          <h2 id="p1-name">电脑</h2>
          <p id="p1-group">尚未分色</p>
          <div class="balls-row" id="p1-balls"></div>
        </div>
      </div>

      <p class="help">
        <strong>不用鼠标：</strong>方向键或 WASD 瞄准和调力道，空格或回车击打。
        也可按住屏幕上的「左转 / 右转 / 力道 / 击打」。
        白球入袋时用方向键移动白球，再按空格放下。
        选模式可按键盘 1 / 2 / 3。
      </p>
    </div>

    <script src="js/physics.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/render.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
