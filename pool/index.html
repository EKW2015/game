<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#120c08" />
    <title>八球台球</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎱</text></svg>" />
    <link rel="stylesheet" href="css/pool.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <h1>🎱 八球台球</h1>
        <div class="tools">
          <button class="btn" id="btn-sound" type="button">音效：开</button>
          <button class="btn" id="btn-reset" type="button">选模式</button>
        </div>
      </header>

      <div class="stage" id="stage">
        <canvas id="table" width="868" height="468" aria-label="台球桌"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlay-title">八球台球</h2>
          <p id="overlay-msg">鼠标（或手指）指向要打的方向，按住往后拉杆，松手击打。先打进全色或花色就归你，清完再打 8 号。</p>
          <div class="modes" id="modes">
            <button class="mode play" type="button" data-mode="vsai">对战电脑</button>
            <button class="mode" type="button" data-mode="hotseat">双人对战</button>
            <button class="mode" type="button" data-mode="practice">练习模式</button>
          </div>
        </div>
      </div>

      <div class="hud">
        <div class="card" id="p0">
          <h2 id="p0-name">你</h2>
          <p id="p0-group">尚未分色</p>
          <div class="balls-row" id="p0-balls"></div>
        </div>
        <div class="card turn" id="turn-card">
          <div id="turn"><strong>选择模式开始</strong></div>
        </div>
        <div class="card" id="p1">
          <h2 id="p1-name">电脑</h2>
          <p id="p1-group">尚未分色</p>
          <div class="balls-row" id="p1-balls"></div>
        </div>
      </div>

      <p class="help">
        瞄准白球前方 · 按住往后拉杆，松手出杆（也可按空格击打）。
        白球入袋或先碰到对方球算犯规，对方自由球。
        把己方球打完后，再把 8 号打进就赢；8 号进早了则判负。
      </p>
    </div>

    <script src="js/physics.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/render.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
