<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#120c08" />
    <title>八球台球</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎱</text></svg>" />
    <style>:root {
  --bg: #120c08;
  --wood: #5b3318;
  --wood-dark: #3a1f0c;
  --felt: #0b6a42;
  --gold: #e4c27a;
  --ink: #f3ead8;
  --muted: #b8a888;
  --danger: #ff8a7a;
  --panel: rgba(18, 10, 6, 0.72);
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background:
    radial-gradient(1200px 600px at 50% -10%, #2a1a0e 0%, var(--bg) 55%);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}

.wrap {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 18px 14px 28px;
  gap: 12px;
}

.top {
  width: min(1100px, 100%);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

h1 {
  margin: 0;
  font-size: clamp(22px, 3vw, 30px);
  letter-spacing: 0.08em;
  color: var(--gold);
}

.tools { display: flex; gap: 8px; flex-wrap: wrap; }

.btn {
  font: inherit;
  font-size: 13px;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid rgba(228, 194, 122, 0.28);
  background: #2a1a10;
  color: var(--ink);
  cursor: pointer;
}

.btn:hover { border-color: var(--gold); color: #fff; }

.stage {
  position: relative;
  width: min(1100px, 100%);
  background: var(--wood-dark);
  border-radius: 18px;
  padding: 10px;
  box-shadow: 0 24px 50px -24px rgba(0, 0, 0, 0.85);
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 12px;
  touch-action: none;
  cursor: crosshair;
  background: #083322;
}

.hud {
  width: min(1100px, 100%);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  align-items: stretch;
}

.card {
  background: var(--panel);
  border: 1px solid rgba(228, 194, 122, 0.18);
  border-radius: 12px;
  padding: 10px 14px;
  min-height: 72px;
}

.card h2 {
  margin: 0 0 4px;
  font-size: 13px;
  color: var(--gold);
  font-weight: 600;
}

.card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }

.card.active {
  border-color: var(--gold);
  box-shadow: 0 0 0 1px rgba(228, 194, 122, 0.25);
}

.turn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-width: 180px;
}

.turn strong { color: var(--gold); font-size: 16px; }

.balls-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}

.chip {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.35);
  font-size: 10px;
  display: grid;
  place-items: center;
  color: #111;
  font-weight: 700;
}

.chip.gone { opacity: 0.25; filter: grayscale(0.8); }

.help {
  width: min(1100px, 100%);
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
  margin: 0;
}

.overlay {
  position: absolute;
  inset: 10px;
  border-radius: 12px;
  background: rgba(8, 4, 2, 0.72);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  gap: 10px;
}

.overlay.hidden { display: none; }

.overlay h2 {
  margin: 0;
  font-size: 28px;
  color: var(--gold);
}

.overlay p { margin: 0; max-width: 440px; color: var(--muted); }

.modes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }

.mode {
  font: inherit;
  padding: 10px 18px;
  border-radius: 12px;
  border: 1px solid rgba(228, 194, 122, 0.4);
  background: #3a2414;
  color: var(--ink);
  cursor: pointer;
}

.mode.hidden { display: none; }

.stars { letter-spacing: 0.12em; color: var(--gold); font-size: 22px; }

.pad {
  width: min(1100px, 100%);
  display: grid;
  grid-template-columns: repeat(4, 1fr) 1.4fr;
  gap: 8px;
}

.pad__btn, .pad__shoot {
  font: inherit;
  border-radius: 12px;
  border: 1px solid rgba(228, 194, 122, 0.35);
  background: #2a1a10;
  color: var(--ink);
  cursor: pointer;
  padding: 12px 8px;
  line-height: 1.25;
  min-height: 58px;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

.pad__btn small, .pad__shoot small {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 2px;
}

.pad__btn:active, .pad__btn.is-down {
  background: #5b3318;
  border-color: var(--gold);
}

.pad__shoot {
  background: #c9a24a;
  color: #1a1008;
  font-weight: 700;
  border-color: transparent;
}

.pad__shoot:active { filter: brightness(1.08); }

.pad.is-place .pad__shoot { background: #7ecb8a; }

@media (max-width: 720px) {
  .hud { grid-template-columns: 1fr; }
  .turn { min-height: 56px; }
  .pad { grid-template-columns: 1fr 1fr; }
  .pad__shoot { grid-column: 1 / -1; min-height: 64px; font-size: 18px; }
}
</style>

    <div class="wrap">
      <header class="top">
        <h1>🎱 八球台球</h1>
        <div class="tools">
          <button class="btn" id="btn-sound" type="button">音效：开</button>
          <button class="btn" id="btn-reset" type="button">选模式</button>

          <div class="modes" id="modes">
            <button class="mode play" type="button" data-mode="challenge">闯关挑战</button>
            <button class="mode" type="button" data-mode="vsai">对战电脑</button>
            <button class="mode" type="button" data-mode="hotseat">双人对战</button>

            <button class="mode play hidden" type="button" data-mode="challenge-next" id="btn-next">下一关</button>
          </div>
        </div>
      </div>

      <div class="pad" id="pad">
        <button class="pad__btn" type="button" data-hold="left">◀ 左转<br><small>A / ←</small></button>
        <button class="pad__btn" type="button" data-hold="right">右转 ▶<br><small>D / →</small></button>
        <button class="pad__btn" type="button" data-hold="down">力道－<br><small>S / ↓</small></button>
        <button class="pad__btn" type="button" data-hold="up">力道＋<br><small>W / ↑</small></button>
        <button class="pad__shoot" type="button" id="btn-shoot">击打<br><small>空格</small></button>

      <div class="hud">

        </div>
        <div class="card" id="p1">
          <h2 id="p1-name">电脑</h2>
          <p id="p1-group">尚未分色</p>
          <div class="balls-row" id="p1-balls"></div>
        </div>
      </div>

      <p class="help">
        <strong>闯关最好玩：</strong>按 4 开始。方向键瞄准，空格击打。进袋有连击加分。
        过关后按回车进下一关。M 打开菜单。
      </p>
    </div>

    <script>/**
 * 台球物理：向量、球-球碰撞、库边、袋口。
 */
(function (global) {
  'use strict';

  var Pool = global.Pool || (global.Pool = {});

  var TW = 800;
  var TH = 400;
  var R = 9.2;
  var POCKET_R = 22;
  var CUSHION = 34;
  var FRICTION = 0.5;
  var STOP = 5;
  var REST = 0.88;
  var RAIL_REST = 0.84;
  var MAX_SPEED = 2200;

  var POCKETS = [
    { x: 2, y: 2, corner: true },
    { x: TW / 2, y: -4, corner: false },
    { x: TW - 2, y: 2, corner: true },
    { x: 2, y: TH - 2, corner: true },
    { x: TW / 2, y: TH + 4, corner: false },
    { x: TW - 2, y: TH - 2, corner: true }
  ];

  function vec(x, y) {
    return { x: x, y: y };
  }

  function add(a, b) {
    return vec(a.x + b.x, a.y + b.y);
  }

  function sub(a, b) {
    return vec(a.x - b.x, a.y - b.y);
  }

  function scale(a, s) {
    return vec(a.x * s, a.y * s);
  }

  function dot(a, b) {
    return a.x * b.x + a.y * b.y;
  }

  function len(a) {
    return Math.sqrt(a.x * a.x + a.y * a.y);
  }

  function dist(a, b) {
    return len(sub(a, b));
  }

  function norm(a) {
    var L = len(a);
    if (L < 1e-8) return vec(0, 0);
    return vec(a.x / L, a.y / L);
  }

  function clamp(v, a, b) {
    return v < a ? a : v > b ? b : v;
  }

  function nearPocket(p, extra) {
    extra = extra || 0;
    var i;
    for (i = 0; i < POCKETS.length; i++) {
      if (dist(p, POCKETS[i]) < POCKET_R + extra) return POCKETS[i];
    }
    return null;
  }

  function makeBall(id, x, y, group, color, label) {
    return {
      id: id,
      x: x,
      y: y,
      vx: 0,
      vy: 0,
      r: R,
      group: group,
      color: color,
      label: label,
      pocketed: false

  }

  function moving(ball) {
    return !ball.pocketed && (ball.vx * ball.vx + ball.vy * ball.vy) > STOP * STOP;
  }

  function anyMoving(balls) {
    var i;
    for (i = 0; i < balls.length; i++) {
      if (moving(balls[i])) return true;
    }
    return false;
  }

  function integrate(balls, dt) {
    var i, b, speed, damp;
    damp = Math.exp(-FRICTION * dt);
    for (i = 0; i < balls.length; i++) {
      b = balls[i];
      if (b.pocketed) continue;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.vx *= damp;
      b.vy *= damp;
      speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);

        b.vx *= MAX_SPEED / speed;
        b.vy *= MAX_SPEED / speed;
      } else if (speed < STOP) {
        b.vx = 0;
        b.vy = 0;
      }
    }
  }

  function hitCushions(balls) {
    var i, b, pk;
    for (i = 0; i < balls.length; i++) {
      b = balls[i];
      if (b.pocketed) continue;
      pk = nearPocket(b, 6);
      if (pk) continue;
      if (b.x < R) {
        b.x = R;
        if (b.vx < 0) b.vx = -b.vx * RAIL_REST;
      } else if (b.x > TW - R) {
        b.x = TW - R;
        if (b.vx > 0) b.vx = -b.vx * RAIL_REST;
      }
      if (b.y < R) {
        b.y = R;
        if (b.vy < 0) b.vy = -b.vy * RAIL_REST;
      } else if (b.y > TH - R) {
        b.y = TH - R;
        if (b.vy > 0) b.vy = -b.vy * RAIL_REST;
      }
    }
  }

  function collidePair(a, b) {
    var nx, ny, d, overlap, inv, dvx, dvy, rel, impulse, j;
    nx = b.x - a.x;

    ny *= inv;

    a.y -= ny * overlap * 0.5;
    b.x += nx * overlap * 0.5;
    b.y += ny * overlap * 0.5;

    dvy = a.vy - b.vy;

      b.vx = 0;
      b.vy = 0;
      fallen.push(b);

    return fallen;

  function firstHit(cue, others, dtHint) {
    /* 用当前速度方向做短射线，找最先碰到的目标球（开球后由记录覆盖） */

    var uy = cue.vy / speed;
    for (i = 0; i < others.length; i++) {
      b = others[i];
      if (b.pocketed || b.id === cue.id) continue;
      nx = b.x - cue.x;
      ny = b.y - cue.y;
      t = nx * ux + ny * uy;
      if (t <= 0) continue;
      d = nx * nx + ny * ny - t * t;
      if (d > (cue.r + b.r) * (cue.r + b.r)) continue;
      if (t < bestT) {
        bestT = t;
        closest = b;
      }
    }
    return closest;
  }

  function pathClear(balls, from, to, ignoreA, ignoreB, radius) {
    var i, b, ab, ac, t, L, closest, d;
    ab = sub(to, from);
    L = len(ab);
    if (L < 1e-6) return true;
    for (i = 0; i < balls.length; i++) {
      b = balls[i];
      if (b.pocketed || b === ignoreA || b === ignoreB) continue;
      ac = sub(b, from);
      t = clamp(dot(ac, ab) / (L * L), 0, 1);
      closest = add(from, scale(ab, t));
      d = dist(closest, b);
      if (d < b.r + radius - 0.4) return false;
    }
    return true;
  }

  function overlapsAny(balls, x, y, r, ignore) {
    var i, b;
    for (i = 0; i < balls.length; i++) {
      b = balls[i];
      if (b.pocketed || b === ignore) continue;
      if (dist(b, { x: x, y: y }) < b.r + r + 0.2) return true;
    }
    return false;
  }

  Pool.TW = TW;
  Pool.TH = TH;
  Pool.R = R;
  Pool.POCKET_R = POCKET_R;
  Pool.CUSHION = CUSHION;
  Pool.POCKETS = POCKETS;
  Pool.vec = vec;
  Pool.add = add;
  Pool.sub = sub;
  Pool.scale = scale;
  Pool.dot = dot;
  Pool.len = len;
  Pool.dist = dist;
  Pool.norm = norm;
  Pool.clamp = clamp;
  Pool.nearPocket = nearPocket;
  Pool.makeBall = makeBall;
  Pool.moving = moving;
  Pool.anyMoving = anyMoving;
  Pool.integrate = integrate;
  Pool.hitCushions = hitCushions;
  Pool.collidePair = collidePair;
  Pool.collideBalls = collideBalls;
  Pool.pocketBalls = pocketBalls;
  Pool.firstHit = firstHit;
  Pool.pathClear = pathClear;
  Pool.overlapsAny = overlapsAny;

/**
 * 台球音效（Web Audio，无需外部文件）。

(function (global) {
  'use strict';

  var Pool = global.Pool || (global.Pool = {});
  var ctx = null;
  var muted = false;

    if (muted) return;

    var g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, c.currentTime);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, c.currentTime + dur);
    g.gain.setValueAtTime(gain || 0.08, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.connect(g);
    g.connect(c.destination);
    o.start();
    o.stop(c.currentTime + dur);

    unlock: function () { ac(); },
    toggle: function () {

    isMuted: function () { return muted; },

      beep(90 + power * 40, 0.08, 'sine', 0.07 + power * 0.06, 50);
    },
    collide: function (force) {
      var f = Pool.clamp(force / 400, 0.15, 1);
      beep(180 + f * 120, 0.05, 'triangle', 0.03 + f * 0.05);

    rail: function () {
      beep(140, 0.04, 'square', 0.02);
    },
    pocket: function () {
      beep(220, 0.18, 'sine', 0.09, 90);
    },
    combo: function (n) {

      setTimeout(function () { beep(440 + n * 40, 0.16, 'sine', 0.08); }, 70);

/**
 * 八球规则：开球、花色分配、犯规、胜负。

(function (global) {
  'use strict';

  var Pool = global.Pool || (global.Pool = {});

  var SOLIDS = [1, 2, 3, 4, 5, 6, 7];

    var i, n = 0, b;
    for (i = 0; i < balls.length; i++) {

  function ballById(balls, id) {
    var i;
    for (i = 0; i < balls.length; i++) if (balls[i].id === id) return balls[i];

  function legalGroup(state, player) {
    if (state.openTable) return null;

  }

  function remainingAtStart(balls, group, pocketed) {
    var n = remaining(balls, group);
    var i, b;
    for (i = 0; i < (pocketed || []).length; i++) {

    return n;

    if (!ball || ball.group === 'cue') return false;

      var g = legalGroup(state, player);

      return !!(g && remaining(state.balls, g) === 0);

    if (state.openTable) return ball.group === 'solid' || ball.group === 'stripe';
    return ball.group === legalGroup(state, player);
  }

  function isLegalTarget(state, player, ball) {
    if (!ball || ball.pocketed) return false;
    return ballGroupLegal(state, player, ball);
  }

  function summarizeShot(state, shot) {
    /* shot: { firstHit, pocketed: Ball[], cuePocketed, scratchPlacement } */
    var player = state.turn;
    var pocketed = shot.pocketed || [];

    var first = shot.firstHit;
    var eightIn = false;
    var ownIn = false;
    var anyObj = false;
    var i, b, g, foul, reason, win, lose;

    for (i = 0; i < pocketed.length; i++) {
      b = pocketed[i];
      if (b.group === 'cue') continue;

  function Table(canvas, hooks) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.hooks = hooks || {};
    this.C = Pool.CUSHION;
    this.mode = 'menu';
    this.names = ['玩家 1', '玩家 2'];
    this.reset('vsai');
    this.bind();
    this.last = 0;
    this.acc = 0;
    this.loop = this.loop.bind(this);
    global.requestAnimationFrame(this.loop);
  }

  Table.prototype.reset = function (mode, opts) {
    opts = opts || {};
    var keepScore = this.mode === 'challenge' && mode === 'challenge' && !opts.fresh;
    this.mode = mode || this.mode || 'vsai';
    if (opts.fresh) this.levelIndex = 0;
    this.turn = 0;
    this.openTable = true;
    this.assignment = [null, null];
    this.phase = 'aim';
    this.aimX = 1;
    this.aimY = 0;
    this.pull = this.mode === 'challenge' ? 78 : 150;
    this.keys = { left: false, right: false, up: false, down: false, shift: false };
    this.menuOpen = false;
    this.dragging = false;
    this.aimLocked = this.mode === 'challenge';
    this.placing = false;
    this.placeAnywhere = false;
    this.firstHit = null;
    this.shotPocketed = [];
    this.cuePocketed = false;
    this.winner = -1;
    this.foulReason = '';
    this.aiTimer = 0;
    this.aiLevel = this.mode === 'vsai' ? 0.16 : 0.22;
    this.score = keepScore ? (this.score || 0) : 0;
    this.combo = 0;
    this.stars = 0;
    this.shake = 0;
    this.slow = 0;
    this.pops = [];
    this.sparks = [];
    this.levelIndex = this.mode === 'challenge' ? (this.levelIndex || 0) : 0;
    if (this.mode === 'challenge') this.loadChallenge(this.levelIndex);
    else this.balls = rackBalls();
    if (this.mode === 'challenge') this.pull = 78;
    if (this.mode === 'practice') this.names = ['练习', ''];
    else if (this.mode === 'vsai') this.names = ['你', '电脑'];
    else if (this.mode === 'challenge') {
      this.names = ['闯关', '目标'];
    } else this.names = ['玩家 1', '玩家 2'];
    this.msg = this.mode === 'challenge'
      ? (this.levelName + '：' + this.levelInfo)
      : '方向键瞄准，空格击打';
    this.emit();
  };

  Table.prototype.loadChallenge = function (index) {
    var L = Pool.LEVELS[index];
    var i, spec, id, group, cue, first;
    if (!L) L = Pool.LEVELS[0];
    this.levelIndex = index;
    this.levelName = L.name;
    this.levelInfo = L.info;
    this.maxShots = L.shots;
    this.need = L.need;
    this.shotsUsed = 0;
    this.cleared = 0;
    this.placeAnywhere = true;
    cue = Pool.makeBall(0, L.cue.x, L.cue.y, 'cue', '#f4f4f0', '');
    this.balls = [cue];
    for (i = 0; i < L.balls.length; i++) {
      spec = L.balls[i];
      id = spec.id;
      group = id === 8 ? 'eight' : id < 8 ? 'solid' : 'stripe';
      this.balls.push(Pool.makeBall(id, spec.x, spec.y, group, COLORS[id], id));
    }
    first = this.balls[1];
    if (first) this.aimAtPocket(cue, first, L.aimPocket);
    this.aimLocked = true;
  };

  Table.prototype.aimAtPocket = function (cue, ball, pocketIndex) {
    var pk, i, ghost, n, toPk, score, best = null, bestScore = -1e9;
    if (pocketIndex != null && Pool.POCKETS[pocketIndex]) {
      pk = Pool.POCKETS[pocketIndex];
    } else {
      for (i = 0; i < Pool.POCKETS.length; i++) {
        pk = Pool.POCKETS[i];
        toPk = Pool.norm(Pool.sub(pk, ball));
        ghost = Pool.sub(ball, Pool.scale(toPk, cue.r + ball.r));
        n = Pool.norm(Pool.sub(ghost, cue));
        if (!n.x && !n.y) continue;
        score = Pool.dot(n, toPk) * 100 - Pool.dist(ball, pk) * 0.03;
        if (score > bestScore) {
          bestScore = score;
          best = pk;
        }
      }
      pk = best || Pool.POCKETS[5];
    }
    toPk = Pool.norm(Pool.sub(pk, ball));
    ghost = Pool.sub(ball, Pool.scale(toPk, cue.r + ball.r));
    n = Pool.norm(Pool.sub(ghost, cue));
    this.aimX = n.x || 1;
    this.aimY = n.y || 0;
  };

  Table.prototype.reaimRemaining = function () {
    var cue = this.cue();
    var i, b, L;
    if (!cue || cue.pocketed) return;
    L = Pool.LEVELS[this.levelIndex];
    for (i = 1; i < this.balls.length; i++) {
      b = this.balls[i];
      if (b.pocketed) continue;
      this.aimAtPocket(cue, b, L && L.aimPocket);
      return;
    }
  };

  Table.prototype.addPop = function (x, y, text, color, size) {
    this.pops.push({ x: x, y: y, text: text, color: color || '#ffe08a', size: size || 20, life: 1, vy: -38 });
  };

  Table.prototype.addSparks = function (x, y, color) {
    var i, a;
    for (i = 0; i < 14; i++) {
      a = Math.random() * Math.PI * 2;
      this.sparks.push({
        x: x,
        y: y,
        vx: Math.cos(a) * (40 + Math.random() * 90),
        vy: Math.sin(a) * (40 + Math.random() * 90),
        r: 1.5 + Math.random() * 2.5,
        color: color || '#ffe08a',
        life: 0.7 + Math.random() * 0.4
      });
    }
  };

  Table.prototype.updateFx = function (dt) {
    var i, p, s;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 18);
    if (this.slow > 0) this.slow = Math.max(0, this.slow - dt);
    for (i = this.pops.length - 1; i >= 0; i--) {
      p = this.pops[i];
      p.y += p.vy * dt;
      p.life -= dt * 0.9;
      if (p.life <= 0) this.pops.splice(i, 1);
    }
    for (i = this.sparks.length - 1; i >= 0; i--) {
      s = this.sparks[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vy += 80 * dt;
      s.life -= dt * 1.6;
      if (s.life <= 0) this.sparks.splice(i, 1);
    }
  };

  Table.prototype.saveBest = function () {
    try {
      var key = 'poolFun.best';
      var best = parseInt(global.localStorage.getItem(key), 10) || 0;
      if (this.score > best) global.localStorage.setItem(key, String(this.score));
    } catch (e) {}
  };

  Table.prototype.cue = function () {
    return Pool.Rules.ballById(this.balls, 0);
  };

  Table.prototype.emit = function () {
    if (this.hooks.onHud) this.hooks.onHud(this);
  };

  Table.prototype.clientToTable = function (clientX, clientY) {
    var rect = this.canvas.getBoundingClientRect();
    var sx = this.canvas.width / rect.width;
    var sy = this.canvas.height / rect.height;
    return {
      x: (clientX - rect.left) * sx - this.C,
      y: (clientY - rect.top) * sy - this.C
    };
  };

  Table.prototype.bind = function () {
    var self = this;
    var el = this.canvas;

    function down(ev) {
      ev.preventDefault();
      Pool.Sfx.unlock();
      var p = self.pointer(ev);
      self.onDown(p);
    }
    function move(ev) {
      ev.preventDefault();
      self.onMove(self.pointer(ev));
    }
    function up(ev) {
      ev.preventDefault();
      self.onUp(self.pointer(ev));
    }
    el.addEventListener('mousedown', down);
    global.addEventListener('mousemove', move);
    global.addEventListener('mouseup', up);
    el.addEventListener('touchstart', down, { passive: false });
    global.addEventListener('touchmove', move, { passive: false });
    global.addEventListener('touchend', up);
    global.addEventListener('keydown', function (ev) {
      self.onKey(ev, true);
    });
    global.addEventListener('keyup', function (ev) {
      self.onKey(ev, false);
    });
    global.addEventListener('blur', function () {
      self.keys.left = self.keys.right = self.keys.up = self.keys.down = false;
    });
  };

  Table.prototype.keyName = function (code) {
    if (code === 'ArrowLeft' || code === 'KeyA' || code === 'KeyQ') return 'left';
    if (code === 'ArrowRight' || code === 'KeyD' || code === 'KeyE') return 'right';
    if (code === 'ArrowUp' || code === 'KeyW') return 'up';
    if (code === 'ArrowDown' || code === 'KeyS') return 'down';
    if (code === 'ShiftLeft' || code === 'ShiftRight') return 'shift';
    return '';
  };

  Table.prototype.onKey = function (ev, down) {
    var name = this.keyName(ev.code);
    if (name) {
      this.keys[name] = down;
      if (down && (name === 'left' || name === 'right' || name === 'up' || name === 'down')) {
        ev.preventDefault();
      }
    }
    if (!down) return;
    if (ev.repeat) return;
    if (this.menuOpen) return;
    if (ev.code === 'Space' || ev.code === 'Enter') {
      ev.preventDefault();
      Pool.Sfx.unlock();
      if (this.canPlace()) this.confirmPlace();
      else if (this.canAim()) this.shoot(this.pull > 12 ? this.pull : 150);
    }
  };

  Table.prototype.setHold = function (name, down) {
    if (this.keys[name] === undefined) return;
    this.keys[name] = !!down;
    Pool.Sfx.unlock();
  };

  Table.prototype.rotateAim = function (delta) {
    if (!this.canAim()) return;
    var ang = Math.atan2(this.aimY, this.aimX) + delta;
    this.aimX = Math.cos(ang);
    this.aimY = Math.sin(ang);
    this.aimLocked = true;
  };

  Table.prototype.applyHolds = function (dt) {
    var cue, speed, nx, ny, x, y;
    if (this.canAim()) {
      speed = this.keys.shift ? 0.7 : 2.3;
      if (this.keys.left) this.rotateAim(-speed * dt);
      if (this.keys.right) this.rotateAim(speed * dt);
      if (this.keys.up) this.pull = Pool.clamp(this.pull + 160 * dt, 8, 180);
      if (this.keys.down) this.pull = Pool.clamp(this.pull - 160 * dt, 8, 180);
    }
    if (this.canPlace()) {
      cue = this.cue();
      if (!cue) return;
      nx = (this.keys.right ? 1 : 0) - (this.keys.left ? 1 : 0);
      ny = (this.keys.down ? 1 : 0) - (this.keys.up ? 1 : 0);
      if (!nx && !ny) return;
      x = cue.x + nx * 140 * dt;
      y = cue.y + ny * 140 * dt;
      this.moveCueTo(x, y, false);
    }
  };

  Table.prototype.moveCueTo = function (x, y, snap) {
    var cue = this.cue();
    if (!cue) return false;
    if (this.placeAnywhere) {
      x = Pool.clamp(x, Pool.R + 1, Pool.TW - Pool.R - 1);
    } else {
      x = Pool.clamp(x, Pool.R + 1, Pool.TW * 0.25);
    }
    y = Pool.clamp(y, Pool.R + 1, Pool.TH - Pool.R - 1);
    if (Pool.overlapsAny(this.balls, x, y, Pool.R, cue)) {
      if (snap) {
        this.msg = '这里没空位，换个位置放下白球';
        this.emit();
      }
      return false;
    }
    cue.x = x;
    cue.y = y;
    cue.vx = 0;
    cue.vy = 0;
    cue.pocketed = false;
    return true;
  };

  Table.prototype.confirmPlace = function () {
    var cue = this.cue();
    if (!this.canPlace() || !cue) return;
    if (!this.moveCueTo(cue.x, cue.y, true)) return;
    this.phase = 'aim';
    this.pull = this.mode === 'challenge' ? 78 : 150;
    this.msg = '自由球已放好，方向键瞄准，空格击打';
    this.emit();
  };

  Table.prototype.autoPlaceCue = function () {
    var spots = [
      { x: Pool.TW * 0.22, y: Pool.TH * 0.5 },
      { x: Pool.TW * 0.22, y: Pool.TH * 0.32 },
      { x: Pool.TW * 0.22, y: Pool.TH * 0.68 },
      { x: Pool.TW * 0.18, y: Pool.TH * 0.5 },
      { x: Pool.TW * 0.5, y: Pool.TH * 0.5 }
    ];
    var i;
    this.placeAnywhere = true;
    for (i = 0; i < spots.length; i++) {
      if (this.moveCueTo(spots[i].x, spots[i].y, false)) {
        this.phase = 'aim';
        this.pull = this.mode === 'challenge' ? 78 : 150;
        this.emit();
        return;
      }
    }
    this.phase = 'aim';
    this.emit();
  };

  Table.prototype.pointer = function (ev) {
    var t = ev.touches && ev.touches[0] || ev.changedTouches && ev.changedTouches[0];
    var x = t ? t.clientX : ev.clientX;
    var y = t ? t.clientY : ev.clientY;
    return this.clientToTable(x, y);
  };

  Table.prototype.canAim = function () {
    return this.phase === 'aim' && this.winner < 0 && !this.isAiTurn() && !this.menuOpen;
  };

  Table.prototype.canPlace = function () {
    return this.phase === 'place' && this.winner < 0 && !this.isAiTurn() && !this.menuOpen;
  };

  Table.prototype.isAiTurn = function () {
    return this.mode === 'vsai' && this.turn === 1 && this.winner < 0;
  };

  Table.prototype.onDown = function (p) {
    var cue = this.cue();
    if (this.phase === 'place') {
      this.tryPlace(p);
      return;
    }
    if (!this.canAim() || !cue) return;
    this.aimLocked = false;
    this.updateAim(p, cue);
    this.dragging = true;
    this.pull = 8;
  };

  Table.prototype.onMove = function (p) {
    var cue = this.cue();
    if (this.phase === 'place') return;
    if (!cue || this.phase !== 'aim' || this.winner >= 0) return;
    if (this.isAiTurn()) return;
    if (this.dragging) {
      var away = Pool.dot(Pool.sub(cue, p), Pool.norm({ x: this.aimX, y: this.aimY }));
      this.pull = Pool.clamp(away, 8, 180);
    } else if (!this.aimLocked) {
      this.updateAim(p, cue);
    }
  };

  Table.prototype.onUp = function () {
    if (!this.dragging) return;
    this.dragging = false;
    if (this.canAim() && this.pull > 10) this.shoot(this.pull);
    else if (this.pull < 20) this.pull = this.mode === 'challenge' ? 78 : 150;
  };

  Table.prototype.updateAim = function (p, cue) {
    var d = Pool.sub(p, cue);
    if (Pool.len(d) > 0.5) {
      var n = Pool.norm(d);
      this.aimX = n.x;
      this.aimY = n.y;
    }
  };

  Table.prototype.tryPlace = function (p) {
    if (!this.canPlace()) return;
    if (!this.moveCueTo(p.x, p.y, true)) return;
    this.confirmPlace();
  };

  Table.prototype.shoot = function (pull) {
    var cue = this.cue();
    if (!cue || this.phase !== 'aim') return;
    var power = 220 + pull * 9;
    cue.vx = this.aimX * power;
    cue.vy = this.aimY * power;
    this.phase = 'rolling';
    this.firstHit = null;
    this.shotPocketed = [];
    this.cuePocketed = false;
    this.recordedFirst = false;
    this.shake = Math.max(this.shake, 3 + pull / 40);
    Pool.Sfx.cue(pull / 180);
    this.msg = '球在滚动…';
    this.emit();
  };

  Table.prototype.stepPhysics = function (dt) {
    var cue = this.cue();
    var i, b, hit, fallen, maxHit, rel, n;
    for (i = 0; i < this.balls.length; i++) {
      b = this.balls[i];
      if (b.pocketed) continue;
      if (!b.trail) b.trail = [];
      if (Pool.moving(b)) {
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 12) b.trail.shift();
      } else if (b.trail.length) {
        b.trail.shift();
      }
    }
    Pool.integrate(this.balls, dt);
    Pool.hitCushions(this.balls);

    if (!this.recordedFirst && cue && !cue.pocketed) {
      for (i = 1; i < this.balls.length; i++) {
        b = this.balls[i];
        if (b.pocketed) continue;
        if (Pool.dist(cue, b) > cue.r + b.r + 1.2) continue;
        rel = (cue.vx - b.vx) * (b.x - cue.x) + (cue.vy - b.vy) * (b.y - cue.y);
        if (rel > 0) {
          this.firstHit = b;
          this.recordedFirst = true;
          this.shake = Math.max(this.shake, 4);
          break;
        }
      }
    }

    maxHit = 0;
    for (i = 0; i < 8; i++) {
      hit = Pool.collideBalls(this.balls);
      if (hit > maxHit) maxHit = hit;
    }
    if (maxHit > 40) {
      Pool.Sfx.collide(maxHit);
      this.shake = Math.max(this.shake, Math.min(10, maxHit / 80));
    }

    fallen = Pool.pocketBalls(this.balls);
    if (fallen.length) {
      Pool.Sfx.pocket();
      this.slow = Math.max(this.slow, 0.28);
      this.shake = Math.max(this.shake, 7);
      for (i = 0; i < fallen.length; i++) {
        this.shotPocketed.push(fallen[i]);
        if (fallen[i].group === 'cue') this.cuePocketed = true;
        else {
          this.addPop(fallen[i].x, fallen[i].y, '进袋!', '#ffe08a', 22);
          this.addSparks(fallen[i].x, fallen[i].y, fallen[i].color);
        }
      }
      n = fallen.filter(function (b) { return b.group !== 'cue'; }).length;
      if (n >= 2) {
        this.addPop(Pool.TW / 2, Pool.TH / 2, '一杆 ' + n + ' 袋!', '#ffd36a', 28);
        Pool.Sfx.combo(n);
      }
    }
  };

  Table.prototype.awardPockets = function (pocketed) {
    var i, b, n = 0, pts, bonus;
    for (i = 0; i < pocketed.length; i++) {
      b = pocketed[i];
      if (b.group === 'cue') continue;
      n++;
      pts = 100 + (n - 1) * 50;
      if (b.group === 'eight') pts += 50;
      this.score += pts;
    }
    if (n > 0) {
      this.combo += 1;
      if (this.combo >= 2) {
        bonus = this.combo * 40;
        this.score += bonus;
        this.addPop(Pool.TW / 2, 80, '连击 x' + this.combo, '#7ecb8a', 24);
        Pool.Sfx.combo(this.combo);
      }
    } else {
      this.combo = 0;
    }
    this.saveBest();
    return n;
  };

  Table.prototype.finishChallengeShot = function () {
    var n = this.awardPockets(this.shotPocketed);
    this.cleared += n;
    this.shotsUsed += 1;
    if (this.cuePocketed) {
      var cue = this.cue();
      cue.pocketed = false;
      cue.x = Pool.TW * 0.22;
      cue.y = Pool.TH * 0.5;
      cue.vx = 0;
      cue.vy = 0;
      this.combo = 0;
      this.phase = 'place';
      this.placeAnywhere = true;
      this.msg = '白球进袋了！方向键摆好再空格';
    } else {
      this.phase = 'aim';
      this.aimLocked = true;
      this.reaimRemaining();
      this.msg = n ? ('打进 ' + n + ' 颗！空格继续') : '没进，再瞄准一次';
    }
    if (this.cleared >= this.need) {
      this.stars = 1;
      if (this.shotsUsed <= this.maxShots - 1) this.stars = 2;
      if (this.shotsUsed <= Math.max(1, this.maxShots - 2) || n >= 2) this.stars = 3;
      this.winner = 0;
      this.phase = 'over';
      this.score += 200 * this.stars;
      this.saveBest();
      this.msg = this.levelIndex >= Pool.LEVELS.length - 1
        ? ('全部通关！总分 ' + this.score)
        : (this.levelName + ' 过关！' + '★'.repeat(this.stars));
      Pool.Sfx.star();
    } else if (this.shotsUsed >= this.maxShots) {
      this.winner = 1;
      this.phase = 'over';
      this.stars = 0;
      this.msg = '杆数用完了，按 4 重试本关';
      Pool.Sfx.foul();
    }
    this.emit();
  };

  Table.prototype.nextLevel = function () {
    this.levelIndex = (this.levelIndex || 0) + 1;
    if (this.levelIndex >= Pool.LEVELS.length) {
      this.winner = 0;
      this.phase = 'over';
      this.msg = '全部通关！总分 ' + this.score;
      this.emit();
      return false;
    }
    this.reset('challenge');
    return true;
  };

  Table.prototype.finishShot = function () {
    if (this.mode === 'challenge') {
      this.finishChallengeShot();
      return;
    }

    var shot = {
      firstHit: this.firstHit,
      pocketed: this.shotPocketed,
      cuePocketed: this.cuePocketed
    };
    var result = Pool.Rules.summarizeShot(this, shot);
    if (this.mode !== 'practice') {
      Pool.Rules.applyGroups(this, this.shotPocketed, this.turn);
    }
    if (this.mode === 'practice' || this.turn === 0) this.awardPockets(this.shotPocketed);

    if (result.win) {
      this.winner = this.turn;
      this.phase = 'over';
      this.msg = this.names[this.turn] + ' 打进 8 号，获胜！';
      if (this.turn === 0) this.addPop(Pool.TW / 2, Pool.TH / 2, '胜利!', '#ffe08a', 32);
      Pool.Sfx.win();
      this.emit();
      return;
    }
    if (result.lose) {
      this.winner = this.turn === 0 && this.mode !== 'practice' ? 1 : 0;
      if (this.mode === 'practice') this.winner = 1;
      this.phase = 'over';
      this.msg = result.reason || '8 号入袋判负';
      Pool.Sfx.foul();
      this.emit();
      return;
    }

    if (this.cuePocketed) {
      var cue = this.cue();
      cue.pocketed = false;
      cue.x = Pool.TW * 0.22;
      cue.y = Pool.TH * 0.5;
      cue.vx = 0;
      cue.vy = 0;
    }

    if (this.mode === 'practice') {
      this.phase = this.cuePocketed ? 'place' : 'aim';
      this.placeAnywhere = true;
      this.turn = 0;
      this.msg = this.cuePocketed ? '白球入袋，方向键移动白球，空格放下' : (result.ownIn ? '打进了！空格继续' : '方向键瞄准，空格击打');
      this.emit();
      return;
    }

    if (result.foul) {
      this.turn = 1 - this.turn;
      this.phase = 'place';
      this.placeAnywhere = true;
      this.msg = '犯规：' + result.reason + '。方向键移动白球，空格放下';
      Pool.Sfx.foul();
    } else if (result.ownIn) {
      this.phase = 'aim';
      this.msg = '打进了，空格继续击打';
    } else {
      this.turn = 1 - this.turn;
      this.phase = 'aim';
      this.msg = '换人：方向键瞄准，空格击打';
    }
    this.emit();
  };

  Table.prototype.update = function (dt) {
    this.applyHolds(dt);
    this.updateFx(dt);
    if (this.phase === 'rolling') {
      var phys = this.slow > 0 ? dt * 0.38 : dt;
      this.stepPhysics(phys);
      if (!Pool.anyMoving(this.balls)) this.finishShot();
    }
    if (this.phase === 'place' && this.isAiTurn()) {
      this.autoPlaceCue();
    }
    if (this.phase === 'aim' && this.isAiTurn() && this.winner < 0) {
      this.aiTimer += dt;
      if (this.aiTimer > 0.7) {
        this.aiTimer = 0;
        this.aiShoot();
      }
    }
  };

  Table.prototype.aiShoot = function () {
    var shot = Pool.AI.pickShot(this);
    if (!shot) {
      this.aimX = 1;
      this.aimY = 0;
      this.shoot(90);
      return;
    }
    this.aimX = shot.ax;
    this.aimY = shot.ay;
    this.shoot((shot.power - 220) / 9);
  };

  Table.prototype.draw = function () {
    var ctx = this.ctx;
    var C = this.C;
    var w = Pool.TW + C * 2;
    var h = Pool.TH + C * 2;
    var i, cue, sx = 0, sy = 0;
    if (this.canvas.width !== w) this.canvas.width = w;
    if (this.canvas.height !== h) this.canvas.height = h;
    ctx.clearRect(0, 0, w, h);
    if (this.shake > 0) {
      sx = (Math.random() - 0.5) * this.shake;
      sy = (Math.random() - 0.5) * this.shake;
    }
    ctx.save();
    ctx.translate(sx, sy);
    Pool.Render.drawTable(ctx, C);
    if (this.mode === 'challenge') Pool.Render.drawTargets(ctx, this.balls, C);
    for (i = 0; i < this.balls.length; i++) Pool.Render.drawTrail(ctx, this.balls[i], C);
    cue = this.cue();
    if (this.phase === 'aim' && cue && !cue.pocketed && this.winner < 0 && !this.isAiTurn()) {
      Pool.Render.drawAim(ctx, cue, this.aimX, this.aimY, this.balls, C);
      Pool.Render.drawCue(ctx, cue, this.aimX, this.aimY, this.pull, C);
      Pool.Render.drawPower(ctx, this.pull, C);
    }
    for (i = 0; i < this.balls.length; i++) Pool.Render.drawBall(ctx, this.balls[i], C);
    Pool.Render.drawSparks(ctx, this.sparks || [], C);
    Pool.Render.drawPops(ctx, this.pops || [], C);
    Pool.Render.drawHudStrip(ctx, this, C);
    ctx.restore();
  };

  Table.prototype.loop = function (now) {
    if (!this.last) this.last = now;
    var dt = Math.min(0.05, (now - this.last) / 1000);
    this.last = now;
    this.acc += dt;
    while (this.acc >= 1 / 120) {
      this.update(1 / 120);
      this.acc -= 1 / 120;
    }
    this.draw();
    global.requestAnimationFrame(this.loop);
  };

  Pool.Table = Table;
})(typeof window !== 'undefined' ? window : global);

(function (global) {
  'use strict';

  var doc = global.document;
  var canvas = doc.getElementById('table');
  var overlay = doc.getElementById('overlay');
  var overlayTitle = doc.getElementById('overlay-title');
  var overlayMsg = doc.getElementById('overlay-msg');
  var modes = doc.getElementById('modes');
  var btnSound = doc.getElementById('btn-sound');
  var btnReset = doc.getElementById('btn-reset');
  var p0 = doc.getElementById('p0');
  var p1 = doc.getElementById('p1');
  var turnEl = doc.getElementById('turn');
  var p0balls = doc.getElementById('p0-balls');
  var p1balls = doc.getElementById('p1-balls');

  var table = null;

  function chipHtml(ball) {
    var cls = 'chip' + (ball.pocketed ? ' gone' : '');
    var bg = ball.color;
    var label = ball.label;
    if (ball.group === 'stripe') {
      return '<span class="' + cls + '" style="background:linear-gradient(#fff 32%,' + bg + ' 32%,' + bg + ' 68%,#fff 68%)">' + label + '</span>';
    }
    return '<span class="' + cls + '" style="background:' + bg + ';color:' + (ball.group === 'eight' ? '#fff' : '#111') + '">' + label + '</span>';
  }

  function ballsOf(g, group) {
    return g.balls.filter(function (b) { return b.group === group; })
      .sort(function (a, b) { return a.id - b.id; })
      .map(chipHtml).join('');
  }

  function renderHud(g) {
    var a0 = g.assignment[0];
    var a1 = g.assignment[1];
    doc.getElementById('p0-name').textContent = g.names[0] || '玩家 1';
    doc.getElementById('p1-name').textContent = g.names[1] || '玩家 2';
    doc.getElementById('p0-group').textContent = g.mode === 'practice'
      ? ('任意球 · 分 ' + (g.score || 0))
      : g.mode === 'challenge'
        ? (g.levelName + ' · 分 ' + (g.score || 0))
        : (g.openTable ? '尚未分色' : Pool.Rules.groupLabel(a0));
    doc.getElementById('p1-group').textContent = g.mode === 'practice'
      ? '—'
      : g.mode === 'challenge'
        ? ('第 ' + ((g.levelIndex || 0) + 1) + '/' + Pool.LEVELS.length + ' 关')
        : (g.openTable ? '尚未分色' : Pool.Rules.groupLabel(a1));

    p0balls.innerHTML = g.mode === 'challenge'
      ? ballsOf(g, 'solid') + ballsOf(g, 'stripe') + ballsOf(g, 'eight')
      : a0 ? ballsOf(g, a0) : ballsOf(g, 'solid') + ballsOf(g, 'stripe');
    if (g.mode === 'practice' || g.mode === 'challenge') p1balls.innerHTML = '';
    else p1balls.innerHTML = a1 ? ballsOf(g, a1) : '';

    p0.classList.toggle('active', g.turn === 0 && g.winner < 0);
    p1.classList.toggle('active', g.turn === 1 && g.winner < 0 && g.mode !== 'practice' && g.mode !== 'challenge');

    var shoot = doc.getElementById('btn-shoot');
    var pad = doc.getElementById('pad');
    if (shoot) {
      shoot.innerHTML = g.phase === 'place'
        ? '放下白球<br><small>空格</small>'
        : '击打<br><small>空格</small>';
    }
    if (pad) pad.classList.toggle('is-place', g.phase === 'place');

    var t = g.msg;
    if (g.winner >= 0) t = g.msg;
    else if (g.phase === 'place') t = '方向键移动白球，空格放下';
    else if (g.isAiTurn()) t = '电脑瞄准中…';
    turnEl.innerHTML = '<strong>' + t + '</strong>';

    var nextBtn = doc.getElementById('btn-next');
    if (g.winner >= 0) {
      overlay.classList.remove('hidden');
      if (g.mode === 'challenge') {
        overlayTitle.textContent = g.winner === 0 ? g.msg : '再试一次';
        overlayMsg.textContent = g.winner === 0
          ? ('得分 ' + g.score + (g.stars ? '　' + '★'.repeat(g.stars) : '') + '。回车下一关，4 重试。')
          : '按 4 重试本关，或换模式。';
        if (nextBtn) {
          nextBtn.classList.toggle('hidden', !(g.winner === 0 && g.levelIndex < Pool.LEVELS.length - 1));
        }
      } else {
        overlayTitle.textContent = g.mode === 'vsai'
          ? (g.winner === 0 ? '你赢了！' : '电脑赢了')
          : g.names[g.winner] + ' 获胜';
        overlayMsg.textContent = '再来一局，或换个模式。';
        if (nextBtn) nextBtn.classList.add('hidden');
      }
      modes.style.display = '';
    } else if (nextBtn) {
      nextBtn.classList.add('hidden');
    }
  }

  function start(mode) {
    overlay.classList.add('hidden');
    if (!table) {
      table = new Pool.Table(canvas, { onHud: renderHud });
    }
    table.menuOpen = false;
    if (mode === 'challenge-next') {
      if (!table.nextLevel()) {
        overlay.classList.remove('hidden');
        overlayTitle.textContent = '全部通关！';
        overlayMsg.textContent = '总分 ' + table.score + '。按 4 再闯一次。';
        renderHud(table);
        return;
      }
      renderHud(table);
      return;
    }
    if (mode === 'challenge') {
      if (!(table.mode === 'challenge' && table.winner === 1)) table.levelIndex = 0;
    }
    table.reset(mode, { fresh: mode === 'challenge' && table.winner !== 1 });
    renderHud(table);
  }

  function openMenu() {
    overlay.classList.remove('hidden');
    overlayTitle.textContent = '八球台球';
    overlayMsg.textContent = '按 4 闯关（推荐）。1 对战电脑，2 双人，3 练习。方向键瞄准，空格击打。';
    modes.style.display = '';
    if (table) table.menuOpen = true;
  }

  modes.addEventListener('click', function (ev) {
    var btn = ev.target.closest('[data-mode]');
    if (!btn) return;
    start(btn.getAttribute('data-mode'));
  });

  btnReset.addEventListener('click', openMenu);

  btnSound.addEventListener('click', function () {
    var muted = Pool.Sfx.toggle();
    btnSound.textContent = muted ? '音效：关' : '音效：开';
  });

  doc.addEventListener('keydown', function (ev) {
    if (ev.repeat) return;
    if (!overlay.classList.contains('hidden')) {
      if (ev.code === 'Digit1' || ev.key === '1') start('vsai');
      else if (ev.code === 'Digit2' || ev.key === '2') start('hotseat');
      else if (ev.code === 'Digit3' || ev.key === '3') start('practice');
      else if (ev.code === 'Digit4' || ev.key === '4') start('challenge');
      else if (ev.code === 'Enter' && table && table.mode === 'challenge' && table.winner === 0) {
        start('challenge-next');
      }
      return;
    }
    if (ev.code === 'Escape' || ev.code === 'KeyM') {
      ev.preventDefault();
      openMenu();
    }
  });

  var pad = doc.getElementById('pad');
  pad.addEventListener('pointerdown', function (ev) {
    var hold = ev.target.closest('[data-hold]');
    var shoot = ev.target.closest('#btn-shoot');
    if (hold) {
      ev.preventDefault();
      hold.classList.add('is-down');
      hold.setPointerCapture(ev.pointerId);
      if (table) table.setHold(hold.getAttribute('data-hold'), true);
    } else if (shoot) {
      ev.preventDefault();
      if (!table) return;
      Pool.Sfx.unlock();
      if (table.canPlace()) table.confirmPlace();
      else if (table.canAim()) table.shoot(table.pull > 12 ? table.pull : 150);
    }
  });
  pad.addEventListener('pointerup', function (ev) {
    var hold = ev.target.closest('[data-hold]');
    if (hold) {
      hold.classList.remove('is-down');
      if (table) table.setHold(hold.getAttribute('data-hold'), false);
    }
  });
  pad.addEventListener('pointercancel', function () {
    ['left', 'right', 'up', 'down'].forEach(function (k) {
      if (table) table.setHold(k, false);
    });
    Array.prototype.forEach.call(pad.querySelectorAll('.is-down'), function (el) {
      el.classList.remove('is-down');
    });
  });

  overlay.classList.remove('hidden');
})(window);
</script>
</body>
</html>
