name: Deploy Pages

# 用官方 Pages 部署流程，configure-pages 的 enablement 会自动把仓库的
# GitHub Pages 打开，不需要手动去 Settings 里点开关。
on:
  push:
    branches: [main, cursor/night-city-racing-cd71]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
