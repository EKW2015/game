<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="无限 3D 恐龙世界：自由探索、捕食、进化。" />
    <meta name="theme-color" content="#1a3d28" />
    <title>无限恐龙世界 3D</title>
    <style>html,body{background:#0f2418!important;min-height:100vh;margin:0}</style>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🦖</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="boot-screen" style="position:fixed;inset:0;background:#0f2418;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#5cd65c;font-family:sans-serif;text-align:center;padding:20px">
      <div style="font-size:56px;margin-bottom:12px">🦖</div>
      <div style="font-size:24px;font-weight:bold">无限恐龙世界 3D</div>
      <div id="boot-msg" style="font-size:15px;color:#9cb8a8;margin-top:14px">正在加载 3D 引擎，请稍候…</div>
    </div>
    <main class="page">
      <header class="page__header">
        <h1 class="page__title">无限恐龙世界 <span class="badge-3d">3D</span></h1>
        <div class="page__tools">
          <button id="btn-sound" class="tool" type="button" aria-pressed="false">音效：开</button>
          <button id="btn-pause" class="tool" type="button">暂停</button>
        </div>
      </header>

      <div class="stage" id="stage">
        <canvas id="game" class="stage__canvas" role="img" aria-label="无限 3D 恐龙世界"></canvas>
        <div class="crosshair" aria-hidden="true"></div>

        <div class="hud" id="hud">
          <div class="hud__panel">
            <div>阶段: <strong id="hud-stage">幼龙</strong></div>
            <div>体型: <strong id="hud-mass">45</strong></div>
            <div>击杀: <strong id="hud-kills">0</strong></div>
          </div>
          <div class="hud__remain">最高击杀 <strong id="hud-best">0</strong></div>
        </div>

        <div class="toast" id="toast"></div>

        <div class="overlay" id="overlay-ready">
          <p class="overlay__title">无限 3D 恐龙世界 🌍</p>
          <p class="overlay__hint">第一人称视角 · 无限大地图 · 自由探索</p>
          <p class="overlay__hint">方向键移动 · 靠近小恐龙吞食 · 不断进化变大</p>
          <button class="overlay__button" type="button" data-action="start">进入世界</button>
        </div>

        <div class="overlay overlay--hidden" id="overlay-over">
          <p class="overlay__title">你被击败了</p>
          <p class="overlay__score" id="death-stats"></p>
          <button class="overlay__button" type="button" data-action="restart">重新开始</button>
        </div>

        <div class="overlay overlay--hidden" id="overlay-paused">
          <p class="overlay__title">已暂停</p>
          <button class="overlay__button" type="button" data-action="resume">继续探索</button>
        </div>

        <div class="overlay overlay--hidden" id="overlay-error">
          <p class="overlay__title">3D 加载失败</p>
          <p class="overlay__hint" id="error-msg">请用 Chrome 浏览器打开 play.html</p>
        </div>
      </div>

      <div class="touch" id="touch-controls" aria-hidden="true">
        <div class="touch__dpad">
          <button class="touch__btn touch__btn--up" type="button" data-hold="up">↑</button>
          <button class="touch__btn touch__btn--left" type="button" data-hold="left">←</button>
          <button class="touch__btn touch__btn--right" type="button" data-hold="right">→</button>
          <button class="touch__btn touch__btn--down" type="button" data-hold="down">↓</button>
        </div>
        <button class="touch__bite" type="button" data-hold="bite">撕咬</button>
      </div>

      <section class="legend">
        <h2 class="legend__title">怎么玩</h2>
        <ul class="legend__list">
          <li>方向键 / WASD 在无限世界中自由移动</li>
          <li>靠近比自己小的恐龙即可吞食，体型会变大</li>
          <li>进化：幼龙 → 猎手 → 霸主 → 传说</li>
          <li>世界没有边界，一直探索一直变强</li>
        </ul>
      </section>
    </main>

    <script src="js/vendor/three.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/dino.js"></script>
    <script src="js/dinomodel.js"></script>
    <script src="js/world.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/renderer3d.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
