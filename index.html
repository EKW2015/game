<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="一个用原生 HTML5 Canvas 写的小恐龙跑酷游戏，跳过仙人掌、躲开翼龙，看你能跑多远。" />
    <meta name="theme-color" content="#f7f7f7" />
    <title>小恐龙快跑</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🦖</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="page">
      <header class="page__header">
        <h1 class="page__title">小恐龙快跑</h1>
        <div class="page__tools">
          <button id="btn-sound" class="tool" type="button" aria-pressed="false">音效：开</button>
          <button id="btn-pause" class="tool" type="button">暂停</button>
        </div>
      </header>

      <div class="stage" id="stage">
        <canvas id="game" class="stage__canvas" width="1200" height="400" role="img"
          aria-label="小恐龙跑酷游戏画面"></canvas>

        <div class="overlay" id="overlay-ready">
          <p class="overlay__title">准备好了吗？</p>
          <p class="overlay__hint">按 <kbd>空格</kbd> 或 <kbd>↑</kbd> 起跳开始</p>
          <button class="overlay__button" type="button" data-action="start">开始游戏</button>
        </div>

        <div class="overlay overlay--hidden" id="overlay-over">
          <p class="overlay__title">游戏结束</p>
          <p class="overlay__score">
            本次 <strong id="final-score">0</strong>
            <span class="overlay__record" id="record-badge" hidden>新纪录！</span>
          </p>
          <p class="overlay__hint">按 <kbd>空格</kbd> 或 <kbd>R</kbd> 再来一局</p>
          <button class="overlay__button" type="button" data-action="restart">再来一局</button>
        </div>

        <div class="overlay overlay--hidden" id="overlay-paused">
          <p class="overlay__title">已暂停</p>
          <p class="overlay__hint">按 <kbd>P</kbd> 继续</p>
          <button class="overlay__button" type="button" data-action="resume">继续游戏</button>
        </div>
      </div>

      <div class="touch" id="touch-controls" aria-hidden="true">
        <button class="touch__button" type="button" data-hold="jump">跳跃</button>
        <button class="touch__button" type="button" data-hold="duck">蹲下</button>
      </div>

      <section class="legend">
        <h2 class="legend__title">操作说明</h2>
        <ul class="legend__list">
          <li><kbd>空格</kbd> / <kbd>↑</kbd> / <kbd>W</kbd> 跳跃（按住跳更高）</li>
          <li><kbd>↓</kbd> / <kbd>S</kbd> 蹲下躲翼龙，空中按可快速落地</li>
          <li><kbd>P</kbd> 暂停 · <kbd>M</kbd> 静音 · <kbd>R</kbd> 重开</li>
          <li>手机上直接点屏幕跳跃，长按下方按钮蹲下</li>
        </ul>
        <p class="legend__note">跑得越远速度越快，600 分之后会进入夜晚。最高分保存在本地浏览器里。</p>
      </section>
    </main>

    <noscript>
      <p style="text-align: center">这个游戏需要启用 JavaScript 才能运行。</p>
    </noscript>

    <script src="js/sprites.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
